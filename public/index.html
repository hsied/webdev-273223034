<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Events Management System</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      padding: var(--space-4);
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 {
      font-size: var(--text-xl);
      color: var(--color-primary);
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
    }
    button, input {
      font-size: var(--text-base);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
    }
    button {
      background-color: var(--color-primary);
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: var(--color-primary-hover);
    }
    /* Keyboard accessibility */
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }
    .state-box {
      padding: var(--space-4);
      text-align: center;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>University Club Events</h1>
    <p>Browse upcoming club events and manage your registrations.</p>

    <!-- 4 Screen States Container -->
    <div id="app-state" class="card">
      <div class="state-box">Loading upcoming events...</div>
    </div>
  </div>

  <script>
    // Simple frontend logic to render states
    async function loadEvents() {
      const stateBox = document.getElementById('app-state');
      try {
        const res = await fetch('/api/events');
        if (!res.ok) throw new Error('Failed to fetch events from server.');
        const events = await res.json();

        if (events.length === 0) {
          stateBox.innerHTML = '<div class="state-box">No upcoming club events found at this time. Check back later!</div>';
          return;
        }

        stateBox.innerHTML = events.map(e => `
          <div style="border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-3); margin-bottom: var(--space-3);">
            <h3>${e.title}</h3>
            <p>Location: ${e.location} | Capacity: ${e.registeredCount}/${e.capacity}</p>
            <button onclick="registerEvent('${e.id}')">Register for Event</button>
          </div>
        `).join('');
      } catch (err) {
        stateBox.innerHTML = `<div class="state-box" style="color: var(--color-error);">Error: ${err.message}</div>`;
      }
    }

    async function registerEvent(id) {
      try {
        const res = await fetch(`/api/events/${id}/register`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) alert(data.error || 'Registration failed');
        else alert('Successfully registered!');
        loadEvents();
      } catch (e) {
        alert('Network error during registration.');
      }
    }

    loadEvents();
  </script>
</body>
</html>
